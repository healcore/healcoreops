name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          grep -q "^VERSION=$want$" build.sh || { echo "build.sh VERSION != $want"; exit 1; }
          grep -q "const Version = \"$want\"" internal/core/core.go || { echo "core.Version != $want"; exit 1; }

      - name: Tests
        run: |
          go mod tidy
          go vet ./...
          GOOS=windows go vet ./...
          go test ./...

      - name: Build (Windows installer + Linux)
        run: sh ./build.sh

      - name: Checksums
        run: cd dist && sha256sum HealCoreOps-Setup.exe healcoreops-linux-amd64 > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: HealCoreOps
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HealCoreOps-Setup.exe
            dist/healcoreops-linux-amd64
            dist/SHA256SUMS.txt
          generate_release_notes: true
